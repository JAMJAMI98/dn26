<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tool</title>
<style>body{font-family:system-ui,sans-serif;max-width:860px;margin:24px auto;padding:0 16px}input,button{font-size:16px;padding:6px}pre{background:#f4f4f4;padding:12px;overflow:auto}</style>
</head><body>
<h1>도구</h1>
<p>입력하고 실행하면 결과와 근거가 표시됩니다.</p>
<input id="x" value="21"> <button id="go">실행</button>
<pre id="out">-</pre>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out');
  try {
    const r = await fetch('api/compute?x=' + encodeURIComponent(document.getElementById('x').value));
    out.textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) { out.textContent = '오류: ' + e; }
};
</script>
</body></html>
